
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar livro - Biblioteca</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>Publicar livro</h1>

        <p class="subtitulo">
            Cadastre uma nova obra no acervo da biblioteca.
        </p>

        <p th:if="${mensagem}"
           th:text="${mensagem}">
        </p>

        <form th:action="@{/escritor/publicar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <div>
                <label for="titulo">Título do livro:</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título do livro"
                    required>
            </div>

            <div>
                <label for="autor">Nome do autor:</label>
                <input
                    type="text"
                    id="autor"
                    name="autor"
                    placeholder="Digite o nome do autor"
                    required>
            </div>

            <div>
                <label for="dataPublicacao">
                    Data de publicação:
                </label>

                <input
                    type="date"
                    id="dataPublicacao"
                    name="dataPublicacao"
                    required>
            </div>

            <button type="submit">
                Publicar livro
            </button>

        </form>

        <p>
            <a href="/logout">Sair da conta</a>
        </p>

    </div>

</body>
</html>
