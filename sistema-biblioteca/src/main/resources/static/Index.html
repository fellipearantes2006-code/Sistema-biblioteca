<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Biblioteca</h1>
        <p class="subtitulo">Consulte os livros disponíveis no acervo.</p>

        <div id="livros">
            Carregando livros...
        </div>
    </div>

    
    <script>
        async function carregarLivros() {
            const areaLivros = document.getElementById("livros");

            try {
                const resposta = await fetch("/api/livros");

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar livros");
                }

                const livros = await resposta.json();

                if (livros.length === 0) {
                    areaLivros.textContent = "Nenhum livro cadastrado.";
                    return;
                }

                areaLivros.innerHTML = livros.map(livro => {
                    const disponivel = !livro.emprestadoPor;

                    return `
                        <div class="livro">
                            <h2>${livro.titulo}</h2>
                            <p><strong>Autor:</strong> ${livro.autor}</p>

                            <p>
                                <strong>Situação:</strong>
                                <span class="${disponivel ? "disponivel" : "indisponivel"}">
                                    ${disponivel
                                        ? "Disponível"
                                        : "Emprestado para " + livro.emprestadoPor}
                                </span>
                            </p>

                            ${
                                disponivel
                                ? `<button onclick="emprestarLivro(${livro.id})">
                                    Emprestar
                                </button>`
                                : `<button onclick="devolverLivro(${livro.id})">
                                    Devolver
                                </button>`
                            }
                        </div>
                    `;
                }).join("");

            } catch (erro) {
                areaLivros.textContent = "Não foi possível carregar os livros.";
                console.error(erro);
            }
        }

        
        async function emprestarLivro(id) {
            try {
                // Busca o token de segurança do Spring Security
                const csrfResposta = await fetch("/csrf");

                if (!csrfResposta.ok) {
                    throw new Error("Não foi possível obter o token de segurança.");
                }

                const csrf = await csrfResposta.json();

                const resposta = await fetch("/emprestimos", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        [csrf.headerName]: csrf.token
                    },
                    body: new URLSearchParams({
                        id: id
                    })
                });

                if (!resposta.ok) {
                    throw new Error("Falha ao realizar empréstimo.");
                }

                await carregarLivros();

            } catch (erro) {
                alert("Não foi possível realizar o empréstimo.");
                console.error(erro);
            }
        }


        
        async function devolverLivro(id) {
            try {
                const csrfResposta = await fetch("/csrf");

                if (!csrfResposta.ok) {
                    throw new Error("Não foi possível obter o token de segurança.");
                }

                const csrf = await csrfResposta.json();

                const resposta = await fetch("/devolucoes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        [csrf.headerName]: csrf.token
                    },
                    body: new URLSearchParams({
                        id: id
                    })
                });

                if (!resposta.ok) {
                    throw new Error("Falha ao realizar devolução.");
                }

                await carregarLivros();

            } catch (erro) {
                alert("Não foi possível realizar a devolução.");
                console.error(erro);
            }
        }


        carregarLivros();
    </script>

</body>
</html>
