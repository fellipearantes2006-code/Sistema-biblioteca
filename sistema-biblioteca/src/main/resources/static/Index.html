<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Biblioteca</h1>
        <p class="subtitulo">Consulte os livros disponíveis no acervo.</p>

        <div id="livros">
            Carregando livros...
        </div>
    </div>

    <script>
        async function carregarLivros() {
            const areaLivros = document.getElementById("livros");

            try {
                const resposta = await fetch("/api/livros");

                if (!resposta.ok) {
                    throw new Error("Não foi possível buscar os livros.");
                }

                const livros = await resposta.json();

                if (livros.length === 0) {
                    areaLivros.textContent = "Nenhum livro cadastrado.";
                    return;
                }

                areaLivros.innerHTML = livros.map(livro => {
                    const disponivel = !livro.emprestadoPor;

                    return `
                        <div class="livro">
                            <h2>${livro.titulo}</h2>
                            <p><strong>Autor:</strong> ${livro.autor}</p>
                            <p><strong>ID:</strong> ${livro.id}</p>
                            <p>
                                <strong>Situação:</strong>
                                <span class="${disponivel ? "disponivel" : "indisponivel"}">
                                    ${disponivel
                                        ? "Disponível"
                                        : "Emprestado para " + livro.emprestadoPor}
                                </span>
                            </p>
                        </div>
                    `;
                }).join("");

            } catch (erro) {
                areaLivros.textContent =
                    "Erro ao carregar os livros. Verifique se o sistema está funcionando.";
                console.error(erro);
            }
        }

        carregarLivros();
    </script>
</body>
</html>
